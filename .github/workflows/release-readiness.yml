name: Release readiness

on:
  pull_request:
  push:
    branches:
      - main
      - master

# Not: test/*.sql SQL kabul katmani self-seeding'dir (kendi verisini kendisi
# kurar) ve asagidaki db-acceptance isinde taze-migrate bir veritabanina
# karsi agency_app yetkileriyle kosturulur (sessiz atlama yok). Gleam testleri
# ve statik kontroller readiness isinde kalir.
jobs:
  readiness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: development
      APP_PORT: "8082"
      APP_ORIGIN: http://127.0.0.1:8082
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: nexustraveltech
      SECRET_KEY_BASE: ci-test-secret-key-base-0123456789-abcdefghijklmnopqrstuvwxyz-0123456789
      NEXUS_CONFIG_KEY: ci-test-config-key-0123456789-abcdefghijklmnopqrstuvwxyz-0123456789
      NEXUS_API_KEY: ci-test-callback-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.18.1"
          rebar3-version: "3.24.0"

      - name: Build
        shell: pwsh
        run: gleam build

      - name: Prepare integration database
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          # CREATEDB: scratch-tabanli yanlis-DB guard reddetme simleri
          # hedef rolun gecici veritabani yaratmasini ister (db-acceptance
          # isindeki hazirlik ile ayni sozlesme).
          psql -h "$PGHOST" -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE agency_app LOGIN PASSWORD 'ci-agency-test' CREATEDB;"
          psql -h "$PGHOST" -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE nexus_owner NOLOGIN;"
          psql -h "$PGHOST" -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE nexustraveltech;"
          printf 'PGHOST=%s\nPGPORT=%s\nPGDATABASE=%s\nPGUSER=postgres\nPGPASSWORD=postgres\n' "$PGHOST" "$PGPORT" "$PGDATABASE" > .env

      - name: Apply migrations
        shell: pwsh
        run: ./scripts/migrate.ps1

      - name: Gleam tests against running application (flakiness smoke x3)
        shell: bash
        env:
          PGUSER: agency_app
          PGPASSWORD: ci-agency-test
          # Lighthouse audit testleri canlı sunucu ister; bu iş sunucuyu
          # yukarıda başlattığı için burada zorunlu kılınır. Böylece CI'da
          # sunucu erişilemez olsa bile audit sessizce atlanamaz — tests
          # gürültülü panic ile kırılır.
          REQUIRE_LIVE_SERVER: "true"
        run: |
          gleam run > "$RUNNER_TEMP/agency-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8082/ >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 80 "$RUNNER_TEMP/agency-server.log"
            exit 1
          fi
          # Flakiness dumanı: paketi aynı DB + canlı sunucu üzerinde ardışık
          # 3 kez koşar. Testler paralel ve tekrar-koşuma güvenli tasarlandı
          # (benzersiz kullanıcılar, idempotent upsert, kilitli env
          # kapsamları); ardışık yeşil koşular, süreç-genel durumun koşumlar
          # arasında sızmadığının kanıtıdır. Tek bir koşum bile kırmızıya
          # düşer — flakiness sessizce geçilmez.
          smoke_failed=""
          for i in 1 2 3; do
            echo "::group::gleam test — koşum $i/3"
            if gleam test > "$RUNNER_TEMP/gleam-test-$i.log" 2>&1; then
              tail -n 1 "$RUNNER_TEMP/gleam-test-$i.log"
            else
              smoke_failed="$i"
              echo "gleam test koşum $i BAŞARISIZ (ayrıntı aşağıda)"
              tail -n 60 "$RUNNER_TEMP/gleam-test-$i.log"
            fi
            echo "::endgroup::"
          done
          if [ -n "$smoke_failed" ]; then
            echo "Flakiness smoke başarısız: koşum $smoke_failed kırmızı."
            exit 1
          fi
          gleam run -m nexus_connection_callback_test

      - name: Static release script parse
        shell: pwsh
        run: |
          $files = @(
            "scripts/check-release-readiness.ps1",
            "scripts/check-production-gates.ps1",
            "scripts/check-secret-hygiene.ps1",
            "scripts/check-legacy-cleanup.ps1",
            "scripts/check-worker-hygiene.ps1",
            "scripts/check-nexus-callback-flow.ps1",
            "scripts/check-nexus-rest-contract.ps1",
            "scripts/migrate.ps1",
            "scripts/run-db-tests.ps1",
            "scripts/test-wrong-db-guard.ps1",
            "scripts/fresh-db-smoke.ps1",
            "scripts/rebaseline-migration.ps1",
            "scripts/check-runtime-health.ps1",
            "scripts/run-audit-retention.ps1",
            "scripts/backup-restore-drill.ps1",
            "scripts/check-nexus-reservation-queue.ps1",
            "scripts/test-parampos.ps1",
            "scripts/run-e2e-simulation.ps1",
            "scripts/check-wp2-concurrent-booking.ps1",
            "scripts/check-wp2-sales-chain.ps1",
            "scripts/daily-csp-report.ps1",
            "scripts/record-secret-rotation.ps1",
            "scripts/notify-rotation-overdue.ps1",
            "scripts/register-rotation-check-task.ps1"
          )
          foreach ($file in $files) {
            if (!(Test-Path $file)) { throw "Missing script: $file" }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file parse failed: $($errors[0].Message)" }
          }

      - name: Worker hygiene
        shell: pwsh
        run: ./scripts/check-worker-hygiene.ps1

      # Iki deponun notify-rotation-overdue.ps1 parametre ve cikis sozlesmesi
      # esit olmalidir (AGENTS.md: sozlesme degisikligi tek taraflı olamaz).
      # Bu adim yalnizca acente'yi checkout eder, platform deposu olmadigi
      # icin denetim ATLANIR ve exit 0 verir; tam denetim iki depo birlikte
      # oldugunda (yerel check-two-project-contracts.ps1) calisir.
      - name: Rotation notification contract parity (skipped without platform checkout)
        shell: pwsh
        run: node scripts/check-rotation-notify-parity.mjs

      - name: Shared test admin usage check
        shell: pwsh
        run: ./scripts/check-test-shared-admin.ps1

      - name: Production gate negative smoke
        shell: pwsh
        run: |
          $envFile = Join-Path $env:RUNNER_TEMP "unsafe-production.env"
          @"
          APP_ENV=production
          APP_ORIGIN=http://localhost:8082
          SECRET_KEY_BASE=short
          NEXUS_CONFIG_KEY=short
          PGHOST=127.0.0.1
          PGPORT=5432
          PGDATABASE=nexus_agency
          PGUSER=agency_app
          PGPASSWORD=dummy
          TRUSTED_PROXY_SECURE_COOKIES=false
          EDGE_RATE_LIMIT_ENABLED=false
          "@ | Set-Content -LiteralPath $envFile -Encoding UTF8
          pwsh -NoProfile -File scripts/check-production-gates.ps1 -EnvPath $envFile
          if ($LASTEXITCODE -eq 0) { throw "Production gate unexpectedly passed for unsafe env." }
          Write-Host "Unsafe production env rejected as expected."
          exit 0

  # SQL kabul katmani: self-seeding testler taze-migrate veritabaninda
  # agency_app yetkileriyle kosturulur (uygulama perspektifi; izin guard'lari
  # da boylece dogrulanir). Migration zinciri postgres ile uygulanir.
  db-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare agency database
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          # CREATEDB: yanlis-DB guard reddetme simleri scratch veritabani
          # yaratir (readiness isindeki hazirlik ile ayni sozlesme).
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE agency_app LOGIN PASSWORD 'ci-agency-test' CREATEDB;"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE nexus_agency OWNER agency_app;"
          printf 'PGHOST=127.0.0.1\nPGPORT=5432\nPGDATABASE=nexus_agency\nPGUSER=postgres\nPGPASSWORD=postgres\n' > .env

      - name: Apply migrations
        shell: pwsh
        run: ./scripts/migrate.ps1

      # Yanlis-DB guard reddetme testi: scratch DB'de 'catalog' semasi ile
      # migrate.ps1'in platform bicimli hedefi, DDL uygulamadan reddetmesi
      # gerekir (scripts/test-wrong-db-guard.ps1). CI .env'i PGUSER=postgres
      # yazdigi icin sim scratch DB'yi kendi kurup temizler.
      - name: Wrong-database guard rejection test
        shell: pwsh
        run: ./scripts/test-wrong-db-guard.ps1

      - name: SQL acceptance chain (test/*.sql, agency_app)
        shell: pwsh
        run: ./scripts/run-db-tests.ps1 -DbHost 127.0.0.1 -Port 5432 -Database nexus_agency -User agency_app -Password 'ci-agency-test'
